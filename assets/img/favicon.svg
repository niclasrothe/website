<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab-Symbol: Gleis in der Flucht, oben Übergang zur Landebahn -->
  <defs><clipPath id="c"><circle cx="16" cy="16" r="16"/></clipPath></defs>
  <circle cx="16" cy="16" r="16" fill="#2f3238"/>
  <g clip-path="url(#c)" fill="#e08a4f">
    <!-- Schienen: unten breit, zur Ferne hin schmaler -->
    <polygon points="2.6,34 6,34 13.6,-1 12.8,-1"/>
    <polygon points="29.4,34 26,34 18.4,-1 19.2,-1"/>
    <!-- Schwelle im unteren Viertel, mit Abstand zur Landebahn-Symbolik -->
    <rect x="4" y="23.4" width="24" height="2.4" rx="1.2"/>
    <!-- Landebahn-Mittellinie -->
    <rect x="15.3" y="13.6" width="1.4" height="3.2" rx="0.5"/>
    <rect x="15.45" y="8.6" width="1.1" height="2.4" rx="0.4"/>
    <rect x="15.6" y="4.6" width="0.8" height="1.7" rx="0.3"/>
    <rect x="15.7" y="1.6" width="0.6" height="1.1" rx="0.2"/>
    <!-- Randbefeuerung -->
    <circle cx="6.20" cy="15.5" r="1.0"/>
    <circle cx="25.80" cy="15.5" r="1.0"/>
    <circle cx="7.92" cy="10.5" r="0.8"/>
    <circle cx="24.08" cy="10.5" r="0.8"/>
    <circle cx="9.50" cy="6.0" r="0.6"/>
    <circle cx="22.50" cy="6.0" r="0.6"/>
    <circle cx="10.75" cy="2.4" r="0.45"/>
    <circle cx="21.25" cy="2.4" r="0.45"/>
  </g>
</svg>
